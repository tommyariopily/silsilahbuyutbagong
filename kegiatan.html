<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Kegiatan — Silsilah Keluarga Buyut Bagong</title>

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#170908">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Silsilah Bagong">
<link rel="apple-touch-icon" href="assets/icons/icon-180.png">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16.png">

<link rel="stylesheet" href="assets/style.css">
<style>
  /* Gaya khusus halaman Kegiatan */
  .kegiatan-wrap{ max-width:760px; margin:0 auto; padding:34px 20px 60px; position:relative; z-index:1; }
  .kegiatan-intro{ text-align:center; margin-bottom:30px; }
  .kegiatan-intro h2{ font-family:var(--font-display); color:var(--gold-1); font-size:26px; margin:0 0 8px; }
  .kegiatan-intro p{ color:var(--cream-dim); font-size:13.5px; max-width:480px; margin:0 auto; line-height:1.6; }

  .event-card{
    display:flex; gap:16px; align-items:flex-start;
    background:linear-gradient(165deg,#4a2c23,#2a130f);
    border:1.5px solid rgba(232,184,75,.5);
    border-radius:16px;
    padding:16px 18px;
    margin-bottom:16px;
    box-shadow:0 12px 26px rgba(0,0,0,.4);
  }
  .event-date{
    flex:none; width:58px; text-align:center;
    background:var(--gold-grad); color:#2a1400;
    border-radius:12px; padding:8px 4px;
  }
  .event-date .d{ font-family:var(--font-display); font-weight:700; font-size:22px; line-height:1; }
  .event-date .m{ font-size:10px; text-transform:uppercase; letter-spacing:.06em; }
  .event-body{ flex:1; min-width:0; }
  .event-body h3{ font-family:var(--font-display); color:#fdf6e6; font-size:18px; margin:0 0 4px; }
  .event-body p{ color:var(--cream-dim); font-size:12.5px; line-height:1.6; margin:0; }
  .event-body .meta{ color:var(--gold-2); font-size:11px; margin-top:6px; letter-spacing:.03em; }
  .event-actions{ display:flex; gap:8px; margin-top:10px; }
  .event-actions .btn{ font-size:11px; padding:5px 11px; }

  .empty-note{
    text-align:center; color:var(--cream-dim); font-size:12.5px;
    border:1px dashed var(--line); border-radius:14px; padding:26px 18px; margin-top:24px;
  }
  .empty-note b{ color:var(--gold-2); display:block; margin-bottom:6px; font-family:var(--font-display); font-size:18px; }
  .empty-note code{ color:var(--gold-1); }

  .back-link{
    display:inline-flex; align-items:center; gap:6px;
    color:var(--gold-2); text-decoration:none; font-size:13px;
    margin-bottom:20px;
  }
  .back-link:hover{ color:var(--gold-1); }

  .kegiatan-toolbar{ display:flex; justify-content:flex-end; margin-bottom:18px; }
</style>
</head>
<body>

  <header class="site-header">
    <img id="logo" class="logo" alt="Logo Keluarga">
    <div class="title-group">
      <h1 id="appTitle">Kegiatan Keluarga</h1>
      <p id="appSubtitle">Keluarga Besar Buyut Bagong</p>
    </div>
  </header>

  <main class="kegiatan-wrap">
    <a href="index.html" class="back-link">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      Kembali ke Bagan Silsilah
    </a>

    <div class="kegiatan-intro">
      <h2>Agenda &amp; Kegiatan Keluarga</h2>
      <p>Kumpulan acara, reuni, dan kegiatan Keluarga Besar Buyut Bagong — tersimpan di Google Sheets yang sama dengan bagan silsilah.</p>
    </div>

    <div class="kegiatan-toolbar">
      <button type="button" class="btn" id="btnAddKegiatan">+ Tambah Kegiatan</button>
    </div>

    <div id="kegiatanList">
      <div class="loader"><div class="spin"></div> Memuat kegiatan…</div>
    </div>
  </main>

  <!-- ============ FORM MODAL (ADD/EDIT KEGIATAN) ============ -->
  <div class="overlay" id="kegiatanFormOverlay">
    <div class="modal">
      <button class="modal-close" type="button" onclick="closeKegiatanForm()">&times;</button>
      <h2 style="font-family:var(--font-display);color:var(--gold-1);margin-top:0;" id="kegiatanFormTitle">Tambah Kegiatan</h2>
      <form id="kegiatanForm">
        <div class="form-grid">
          <div class="full">
            <label>Judul Kegiatan *</label>
            <input type="text" name="judul" required placeholder="Contoh: Reuni Akbar Keluarga">
          </div>
          <div>
            <label>Tanggal</label>
            <input type="date" name="tanggal">
          </div>
          <div>
            <label>Waktu</label>
            <input type="text" name="waktu" placeholder="Contoh: 09.00">
          </div>
          <div class="full">
            <label>Lokasi</label>
            <input type="text" name="lokasi" placeholder="Contoh: Balai Desa Sukamaju">
          </div>
          <div class="full">
            <label>Deskripsi</label>
            <textarea name="deskripsi" placeholder="Detail acara, siapa saja yang diundang, dsb."></textarea>
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn ghost small" id="btnCancelKegiatan">Batal</button>
          <button type="submit" class="btn small">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- ============ BOTTOM NAV ============ -->
  <nav class="bottom-nav" id="bottomNav">
    <a href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
      <span>Beranda</span>
    </a>
    <a href="index.html#cari" onclick="sessionStorage.setItem('sbb_open_search','1')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <span>Cari</span>
    </a>
    <button type="button" id="navAddKegiatan" class="nav-add">
      <span class="add-circle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </span>
      <span>Tambah</span>
    </button>
    <a href="kegiatan.html" class="active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span>Kegiatan</span>
    </a>
  </nav>

  <script src="assets/config.js"></script>
  <script src="assets/kegiatan.js"></script>
  <script>
    document.getElementById('navAddKegiatan')?.addEventListener('click', () => openKegiatanForm(null));
  </script>
  <script src="assets/pwa.js"></script>
</body>
</html>
